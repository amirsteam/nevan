<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nevan Handicraft · Soft, handmade baby clothing from Nepal</title>
    <meta
      name="description"
      content="Soft, handmade baby and kids clothing from Nepal. Cash on delivery and eSewa, delivery across Nepal, free shipping over NPR 5,000."
    />
    <meta name="theme-color" content="#fdf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1514" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Canonical address and social previews. Product, sale and info pages get
         their own copies with page-specific values (backend seoPagesService);
         hooks/useCanonical keeps the canonical link current while browsing. -->
    <link rel="canonical" href="https://nevanhandicraft.com.np/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nevan Handicraft" />
    <meta property="og:url" content="https://nevanhandicraft.com.np/" />
    <meta property="og:title" content="Nevan Handicraft · Soft, handmade baby clothing" />
    <meta
      property="og:description"
      content="Handmade baby and kids clothing from Nepal. Cash on delivery, eSewa, delivery across Nepal."
    />
    <meta property="og:image" content="https://nevanhandicraft.com.np/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nevan Handicraft: soft, handmade baby clothing from Nepal" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://nevanhandicraft.com.np/#organization",
            "name": "Nevan Handicraft",
            "url": "https://nevanhandicraft.com.np/",
            "logo": "https://nevanhandicraft.com.np/logo.webp",
            "email": "anjanastha101@gmail.com",
            "telephone": "+977-9844575932",
            "address": { "@type": "PostalAddress", "addressLocality": "Panauti", "addressRegion": "Kavrepalanchok", "addressCountry": "NP" },
            "sameAs": ["https://www.facebook.com/nevancollections", "https://www.instagram.com/nevancollection/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://nevanhandicraft.com.np/#website",
            "url": "https://nevanhandicraft.com.np/",
            "name": "Nevan Handicraft",
            "publisher": { "@id": "https://nevanhandicraft.com.np/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://nevanhandicraft.com.np/products?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Fonts (Inter, Fraunces) are self-hosted: imported in src/main.tsx -->
    <!-- Product photos: open the connection early (saves a round trip on the first photo) -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Apply the saved theme before first paint (no light flash in dark mode).
         Keep the storage key in sync with src/utils/theme.ts. -->
    <script>
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("nevan-theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <noscript>Nevan Handicraft needs JavaScript to run. Please enable it to shop.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
