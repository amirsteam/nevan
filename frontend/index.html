<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nevan Handicraft · Soft, handmade baby clothing from Nepal</title>
    <meta
      name="description"
      content="Soft, handmade baby and kids clothing from Nepal. Cash on delivery and eSewa, delivery across Nepal, free shipping over NPR 5,000."
    />
    <meta name="theme-color" content="#fdf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1514" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nevan Handicraft" />
    <meta property="og:title" content="Nevan Handicraft · Soft, handmade baby clothing" />
    <meta
      property="og:description"
      content="Handmade baby and kids clothing from Nepal. Cash on delivery, eSewa, delivery across Nepal."
    />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts: Inter (body) + Fraunces (headings); swap so text shows immediately on slow networks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Apply the saved theme before first paint (no light flash in dark mode).
         Keep the storage key in sync with src/utils/theme.ts. -->
    <script>
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("nevan-theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <noscript>Nevan Handicraft needs JavaScript to run. Please enable it to shop.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
